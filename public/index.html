<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Score It</title>
<script src="config.js"></script>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    /* neutrals */
    --bg:#0a0a0b; --surface:#121214; --surface-2:#1a1a1d; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
    --text:#ededef; --mute:#8d8d95; --faint:#5b5b63;
    /* single accent: projector amber */
    --accent:#e9b04a; --accent-ink:#1b1204; --danger:#f0706b;
    /* type scale */
    --t-xs:12px; --t-sm:13px; --t-md:15px; --t-lg:17px; --t-xl:22px; --t-2xl:34px;
    /* spacing (4pt) */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    /* radii: two only */
    --r:8px; --r-lg:12px;
    --ease:cubic-bezier(.2,.7,.2,1);
    color-scheme: dark;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); min-height:100vh;
    font:400 var(--t-md)/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
    font-feature-settings:"cv11","ss01"; -webkit-font-smoothing:antialiased; }
  main { max-width:1120px; margin:0 auto; padding:var(--s4); padding-top:max(var(--s4), env(safe-area-inset-top)); padding-bottom:max(var(--s7), env(safe-area-inset-bottom)); }
  h1,h2,h3,p { margin:0; }
  .label { font-size:var(--t-xs); font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); }
  .muted { color:var(--mute); } .small { font-size:var(--t-sm); } .mono { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  .nums { font-variant-numeric:tabular-nums; }
  svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.i.fill { fill:currentColor; stroke:none; }

  /* ---------- Controls ---------- */
  button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--s2); height:46px; padding:0 var(--s5);
    border-radius:var(--r); border:1px solid var(--line-strong); background:transparent; font-weight:500;
    transition:background .18s var(--ease), border-color .18s, transform .12s, opacity .18s; }
  .btn:hover { background:rgba(255,255,255,.05); } .btn:active { transform:scale(.98); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .btn.primary:hover { background:#f0bb5c; }
  .btn .count { opacity:.6; font-weight:500; }
  .btn.block { width:100%; } .btn:disabled { opacity:.35; cursor:not-allowed; transform:none; }
  .btn.ghost { border-color:transparent; height:36px; padding:0 var(--s3); color:var(--mute); } .btn.ghost:hover { color:var(--text); }
  .iconbtn { width:40px; height:40px; display:inline-grid; place-items:center; border-radius:var(--r); border:1px solid transparent; background:transparent; color:var(--mute); transition:color .18s, background .18s; }
  .iconbtn:hover { color:var(--text); background:rgba(255,255,255,.06); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input, textarea { width:100%; height:46px; padding:0 var(--s4); border-radius:var(--r); border:1px solid var(--line-strong); background:var(--surface); color:var(--text);
    font:inherit; font-size:16px; transition:border-color .18s, box-shadow .18s; }
  textarea { height:auto; padding:var(--s3) var(--s4); resize:none; line-height:1.45; }
  input::placeholder, textarea::placeholder { color:var(--faint); }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(233,176,74,.16); }
  input[type=file] { height:auto; padding:var(--s3) var(--s4); color:var(--mute); }
  .field { display:flex; gap:var(--s2); } .field > input { flex:1; min-width:0; }
  .tabs { display:flex; gap:var(--s5); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .tab { padding:var(--s3) 0; background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; color:var(--mute); font-weight:500; font-size:var(--t-sm); white-space:nowrap; display:flex; gap:var(--s2); align-items:center; transition:color .18s; }
  .tab:hover { color:var(--text); } .tab.on { color:var(--text); border-bottom-color:var(--text); }
  .seg { display:inline-flex; gap:var(--s4); } .seg button { background:none; border:0; padding:0; color:var(--faint); font-size:var(--t-sm); font-weight:500; } .seg button.on { color:var(--text); }

  /* ---------- Layout ---------- */
  .topbar { display:flex; align-items:center; justify-content:space-between; height:48px; margin-bottom:var(--s4); }
  .wordmark { font-weight:600; font-size:var(--t-lg); letter-spacing:-.02em; } .wordmark i { font-style:normal; color:var(--accent); }
  .code { display:inline-flex; align-items:center; gap:var(--s2); height:36px; padding:0 var(--s3); border-radius:var(--r); border:1px solid var(--line); background:transparent; color:var(--text); transition:border-color .18s; }
  .code:hover { border-color:var(--line-strong); } .code b { font:600 var(--t-md) ui-monospace,"SF Mono",Menlo,Consolas,monospace; letter-spacing:.28em; margin-right:-.28em; }
  .code svg { color:var(--mute); }
  .room { display:grid; gap:var(--s5); }
  .col-side > section + section { margin-top:var(--s6); }
  @media (min-width:960px) {
    main { padding:var(--s5) var(--s6) var(--s7); }
    .room { grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr); gap:var(--s7); align-items:start; }
    .col-main { position:sticky; top:var(--s5); }
  }

  /* ---------- Home ---------- */
  .home { max-width:400px; margin:0 auto; padding-top:clamp(40px,16vh,140px); }
  .home h1 { font-size:var(--t-2xl); font-weight:600; letter-spacing:-.035em; line-height:1.05; }
  .home h1 i { font-style:normal; color:var(--accent); }
  .home .lede { margin:var(--s3) 0 var(--s6); color:var(--mute); font-size:var(--t-lg); line-height:1.4; }
  .home .stack > * + * { margin-top:var(--s3); }
  .or { display:flex; align-items:center; gap:var(--s3); margin:var(--s5) 0; color:var(--faint); font-size:var(--t-xs); letter-spacing:.09em; text-transform:uppercase; }
  .or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }
  .codein { text-align:center; font:600 var(--t-lg) ui-monospace,"SF Mono",Menlo,Consolas,monospace !important; letter-spacing:.4em; text-transform:uppercase; padding-left:calc(var(--s4) + .4em) !important; }

  /* ---------- Scene ---------- */
  .scene-label { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:var(--s3); }
  .stage { position:relative; aspect-ratio:16/9; background:#000; overflow:hidden; border-radius:var(--r-lg); }
  .stage .bg { position:absolute; inset:-8%; width:116%; height:116%; object-fit:cover; filter:blur(36px) brightness(.5) saturate(1.1); }
  .stage .fg, .stage video, .stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:contain; }
  .stage.text { display:flex; align-items:flex-end; padding:var(--s6); background:var(--surface); border:1px solid var(--line); }
  .stage.text p { font-size:clamp(22px,3.6vw,38px); font-weight:600; letter-spacing:-.03em; line-height:1.15; max-width:22ch; }
  .scene-meta { display:flex; justify-content:space-between; gap:var(--s4); margin-top:var(--s3); }
  .scene-meta .cap { font-size:var(--t-lg); font-weight:500; letter-spacing:-.01em; line-height:1.35; }
  .scene-meta a { color:var(--faint); text-decoration:none; font-size:var(--t-xs); white-space:nowrap; } .scene-meta a:hover { color:var(--mute); }
  @media (max-width:959px) { .stage { margin:0 calc(var(--s4) * -1); border-radius:0; } .stage.text { border-left:0; border-right:0; } }

  /* ---------- Sections ---------- */
  .steps { display:flex; gap:var(--s4); margin-bottom:var(--s5); font-size:var(--t-xs); font-weight:500; letter-spacing:.09em; text-transform:uppercase; }
  .steps li { list-style:none; color:var(--faint); } .steps li.on { color:var(--text); } .steps li.done { color:var(--mute); } .steps { padding:0; margin-top:0; }
  .section-title { font-size:var(--t-xl); font-weight:600; letter-spacing:-.02em; line-height:1.2; margin-bottom:var(--s4); }
  .stack > * + * { margin-top:var(--s4); }
  .stage.empty { display:grid; place-items:center; padding:var(--s5); }
  .stage.empty p { font-size:var(--t-sm); font-weight:400; letter-spacing:0; color:var(--faint); text-align:center; display:flex; flex-direction:column; align-items:center; gap:var(--s3); }
  .stage.empty svg { width:24px; height:24px; }
  .cta { position:sticky; bottom:max(var(--s3), env(safe-area-inset-bottom)); padding-top:var(--s4); margin-top:var(--s4); background:linear-gradient(to top,var(--bg) 70%,transparent); }
  .hint { color:var(--faint); font-size:var(--t-sm); }
  .wait { display:flex; align-items:center; gap:var(--s3); color:var(--mute); font-size:var(--t-sm); padding:var(--s4) 0; }
  .wait::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.25; } }

  /* browse grid */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .tile { position:relative; aspect-ratio:16/10; padding:0; border:0; border-radius:var(--r); overflow:hidden; background:var(--surface-2); cursor:pointer; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s var(--ease), opacity .2s; }
  .tile:hover img { transform:scale(1.04); }
  .tile.sel { box-shadow:inset 0 0 0 2px var(--accent); } .tile.sel::after { content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 2px var(--accent); border-radius:var(--r); }
  .tile .badge { position:absolute; left:6px; bottom:6px; width:22px; height:22px; display:grid; place-items:center; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; }
  .tile .badge svg { width:11px; height:11px; }
  .skeleton { aspect-ratio:16/10; border-radius:var(--r); background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%); background-size:200% 100%; animation:shimmer 1.3s linear infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  .selected { display:flex; align-items:center; gap:var(--s3); padding:var(--s3); border:1px solid var(--line-strong); border-radius:var(--r); }
  .selected .th { width:72px; aspect-ratio:16/10; border-radius:6px; object-fit:cover; background:var(--surface-2); flex:none; display:grid; place-items:center; color:var(--mute); }

  /* songs */
  .song iframe { display:block; width:100%; height:80px; border:0; border-radius:var(--r); color-scheme:normal; }
  .row-vote { display:grid; grid-template-columns:1fr auto; gap:var(--s3); align-items:center; padding:var(--s3) 0; }
  .vote { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line-strong); background:transparent; color:var(--mute); transition:all .2s var(--ease); }
  .vote:hover { color:var(--text); border-color:var(--text); } .vote.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .yours { font-size:var(--t-xs); color:var(--faint); letter-spacing:.09em; text-transform:uppercase; width:44px; text-align:center; }
  .locked { display:flex; align-items:center; gap:var(--s2); margin-top:var(--s2); color:var(--mute); font-size:var(--t-sm); } .locked svg { color:var(--accent); }

  /* results */
  .result { padding:var(--s4) 0; border-top:1px solid var(--line); }
  .result:first-child { border-top:0; padding-top:0; }
  .result .meta { display:flex; justify-content:space-between; align-items:baseline; gap:var(--s4); margin-top:var(--s3); }
  .result .who { font-weight:500; } .result .pts { font:600 var(--t-xl)/1 -apple-system,"Segoe UI",sans-serif; letter-spacing:-.02em; color:var(--mute); font-variant-numeric:tabular-nums; }
  .result.win .pts { color:var(--accent); } .result.win .tag { color:var(--accent); }
  .tag { font-size:var(--t-xs); font-weight:500; letter-spacing:.09em; text-transform:uppercase; }

  /* standings */
  .stand { list-style:none; margin:var(--s3) 0 0; padding:0; }
  .stand li { display:grid; grid-template-columns:20px 1fr auto auto; align-items:center; gap:var(--s3); padding:var(--s3) 0; border-top:1px solid var(--line); font-size:var(--t-md); }
  .stand li:first-child { border-top:0; }
  .stand .rk { color:var(--faint); font-size:var(--t-sm); }
  .stand .dot { width:6px; height:6px; border-radius:50%; background:transparent; border:1px solid var(--faint); transition:all .25s; } .stand .dot.on { background:var(--accent); border-color:var(--accent); }
  .stand .sc { font-weight:500; min-width:3ch; text-align:right; } .stand .sc.bump { animation:bump .6s var(--ease); }
  @keyframes bump { 30% { color:var(--accent); transform:translateY(-2px); } }
  .tagpill { font-size:var(--t-xs); color:var(--faint); margin-left:var(--s2); }
  .hits .hit { display:flex; gap:var(--s3); align-items:center; padding:var(--s2); margin:0 calc(var(--s2) * -1); border-radius:var(--r); cursor:pointer; transition:background .15s; }
  .hits .hit:hover { background:rgba(255,255,255,.05); } .hits img { width:44px; height:44px; border-radius:6px; }
  .err { color:var(--danger); font-size:var(--t-sm); min-height:1.4em; margin-top:var(--s4); }

  /* ---------- Motion (short, purposeful) ---------- */
  .enter { animation:rise .38s var(--ease) both; }
  .stagger > * { animation:rise .38s var(--ease) both; } .stagger > *:nth-child(2){animation-delay:.05s} .stagger > *:nth-child(3){animation-delay:.1s} .stagger > *:nth-child(4){animation-delay:.15s} .stagger > *:nth-child(n+5){animation-delay:.2s}
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const $app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const PROMPTS = [
  'Walking away in slow motion from a huge explosion', 'The last day of summer vacation', 'An awkward elevator ride with your boss',
  'Sprinting for a bus you will definitely miss', 'The villain finally reveals their master plan', 'Montage: getting ready for the big game',
  'A cat knocking a glass off a table with total confidence', 'Arriving at a party where you know nobody',
  'Driving alone at 3 AM through an empty city', 'The wedding dance floor at 11:45 PM',
];

/* ---------- icons (one family: 24px grid, 1.6 stroke) ---------- */
const PATHS = {
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', play:'<path d="M8 5.5v13l10.5-6.5z"/>', search:'<circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  upload:'<path d="M12 16V5"/><path d="M7.5 9.5L12 5l4.5 4.5"/><path d="M5 19h14"/>', type:'<path d="M5 6h14"/><path d="M12 6v13"/><path d="M9 19h6"/>',
  leave:'<path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9.5"/>',
  copy:'<rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15V6.5A1.5 1.5 0 0 1 6.5 5H15"/>',
  shuffle:'<path d="M4 7h3c3 0 4 10 8 10h5"/><path d="M4 17h3c1.5 0 2.5-1.5 3.5-3"/><path d="M15 7h5"/><path d="M18 4.5L20.5 7 18 9.5"/><path d="M18 14.5l2.5 2.5-2.5 2.5"/>',
  image:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.4"/><path d="M20 16l-4.5-4.5L7 19"/>',
};
const icon = (n, cls = '') => `<svg class="i ${n === 'play' ? 'fill' : ''} ${cls}" viewBox="0 0 24 24" aria-hidden="true">${PATHS[n]}</svg>`;

let session = null; try { session = JSON.parse(sessionStorage.getItem('scoreit') || 'null'); } catch {}
let state = null, cfg = { search:false, scenes:false };
const ui = { err:'', tab:null, type:'image', results:null, loading:false, sel:null, pickTab:'link', hits:null, name:'', code:'', cap:'', url:'', q:'', sq:'', link:'', text:'' };
const last = {}; let inRoom = false, lastPhaseKey = ''; const scoreMemo = {};

const API = (window.SCOREIT_SERVER || '') + '/api/';
async function api(path, body) {
  const opt = body ? { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ ...body, ...(session || {}) }) } : {};
  const r = await fetch(API + path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
const setErr = (m) => { ui.err = m || ''; const el = document.getElementById('err'); if (el) el.textContent = ui.err; };
const act = (path, body) => api(path, body).then((r) => { setErr(''); poll(true); return r; }).catch((e) => { setErr(e.message); });
const save = (s) => { session = s; sessionStorage.setItem('scoreit', JSON.stringify(s)); };
function leave() { sessionStorage.removeItem('scoreit'); session = null; state = null; inRoom = false; Object.keys(last).forEach((k) => delete last[k]); render(); }

async function poll(force) {
  if (!session) return;
  try {
    const s = await api(`state?code=${session.code}&pid=${session.pid}&v=${force ? 0 : (state?.v ?? 0)}`);
    if (!s.unchanged) { state = s; render(); }
  } catch (e) { if (/not found/i.test(e.message)) leave(); }
}
setInterval(() => poll(false), 1500);

/* only touch the DOM when HTML changed; never replace a section while the user types in it */
function setSection(id, html, animateKey, force) {
  const el = document.getElementById(id); if (!el) return;
  if (last[id] === html && !force) return;
  const a = document.activeElement;
  if (!force && last[id + ':k'] === animateKey && a && el.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
  const fresh = last[id] === undefined || last[id + ':k'] !== animateKey;
  last[id] = html; last[id + ':k'] = animateKey;
  el.innerHTML = html;
  if (fresh) { el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
}

/* ---------- views ---------- */
const embed = (id) => `<div class="song"><iframe src="https://open.spotify.com/embed/track/${esc(id)}?utm_source=generator&theme=0" allow="encrypted-media; clipboard-write" loading="lazy" title="Spotify player"></iframe></div>`;
const pad = (n) => String(n).padStart(2, '0');

function sceneMedia(s) {
  if (s.kind === 'text') return `<div class="stage text"><p>${esc(s.caption)}</p></div>`;
  let media = '';
  if (s.kind === 'image') media = `<img class="bg" src="${esc(s.url)}" alt=""><img class="fg" src="${esc(s.url)}" alt="Scene to score" referrerpolicy="no-referrer">`;
  else if (s.kind === 'video') media = `<video src="${esc(s.url)}" poster="${esc(s.poster || '')}" autoplay muted loop playsinline controls preload="auto"></video>`;
  else if (s.kind === 'youtube') media = `<iframe src="https://www.youtube-nocookie.com/embed/${esc(s.id)}?rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Scene video"></iframe>`;
  return `<div class="stage">${media}</div>`;
}
function stageHtml() {
  const s = state.scene;
  if (!s) return `<div class="stage text empty"><p>${icon('image')}${state.me.isHost ? 'Choose a scene to begin' : 'Waiting for the first scene'}</p></div>`;
  const credit = s.credit ? `<a href="${esc(s.credit.url)}" target="_blank" rel="noopener noreferrer">${esc(s.credit.name)} / Pexels</a>` : '';
  return `<div class="scene-label"><span class="label">Scene ${pad(state.round)}</span></div>${sceneMedia(s)}
    ${(s.kind !== 'text' && s.caption) || credit ? `<div class="scene-meta"><span class="cap">${s.kind === 'text' ? '' : esc(s.caption)}</span>${credit}</div>` : ''}`;
}

function headHtml() {
  return `<div class="topbar"><span class="wordmark">Score It<i>.</i></span>
    <div style="display:flex;gap:var(--s2);align-items:center"><button class="code" data-act="copy" aria-label="Copy room code ${esc(state.code)}"><b>${esc(state.code)}</b>${icon('copy')}</button>
    <button class="iconbtn" data-act="leave" aria-label="Leave session">${icon('leave')}</button></div></div>`;
}

function standingsHtml() {
  const ps = [...state.players].sort((a, b) => b.score - a.score);
  return `<h2 class="label">Standings</h2><ol class="stand">${ps.map((p, i) => {
    const done = state.phase === 'picking' ? p.picked : state.phase === 'voting' ? p.voted : false;
    return `<li><span class="rk nums">${i + 1}</span><span>${esc(p.name)}${p.id === state.me.id ? '<span class="tagpill">You</span>' : ''}${p.isHost ? '<span class="tagpill">Host</span>' : ''}</span>
      <span class="dot ${done ? 'on' : ''}" title="${done ? 'Done' : 'Waiting'}"></span><span class="sc nums" data-pid="${esc(p.id)}" data-score="${p.score}">${p.score}</span></li>`;
  }).join('')}</ol>`;
}

/* --- scene setup (host) --- */
function selPreview() {
  const s = ui.sel; if (!s) return '';
  const th = s.kind === 'text' ? `<div class="th">${icon('type')}</div>` : s.kind === 'youtube' ? `<div class="th">${icon('play')}</div>`
    : `<img class="th" src="${esc(s.thumb || s.poster || s.url)}" alt="">`;
  const label = { image:'Image', video:'Video clip', youtube:'YouTube video', text:'Written scene' }[s.kind];
  return `<div class="selected">${th}<div style="flex:1;min-width:0"><div>${esc(label)}</div><div class="hint">Ready to start</div></div><button class="btn ghost" data-act="clear-scene">Change</button></div>`;
}
function setupHtml() {
  const tabs = [...(cfg.scenes ? [['browse', 'Browse', 'image']] : []), ['link', 'Link', 'link'], ['upload', 'Upload', 'upload'], ['text', 'Write', 'type']];
  const tab = tabs.some((t) => t[0] === effectiveTab()) ? effectiveTab() : tabs[0][0];
  let body = '';
  if (tab === 'browse') {
    const grid = ui.loading ? Array.from({ length: 9 }, () => '<div class="skeleton"></div>').join('')
      : (ui.results || []).map((r, i) => `<button class="tile ${ui.sel && ui.sel.url === r.url ? 'sel' : ''}" data-act="pick-scene" data-i="${i}" aria-label="Choose this ${r.kind === 'video' ? 'clip' : 'photo'}">
          <img src="${esc(r.thumb)}" alt="${esc(r.alt || '')}" loading="lazy">${r.kind === 'video' ? `<span class="badge">${icon('play')}</span>` : ''}</button>`).join('');
    body = `<div class="field"><input data-bind="q" value="${esc(ui.q)}" placeholder="Search scenes: rain, road trip, dance" aria-label="Search scenes"><button class="btn" data-act="browse" aria-label="Search">${icon('search')}</button></div>
      <div class="seg"><button class="${ui.type === 'image' ? 'on' : ''}" data-act="type" data-t="image">Photos</button><button class="${ui.type === 'video' ? 'on' : ''}" data-act="type" data-t="video">Videos</button></div>
      <div class="grid">${grid || '<p class="hint">No results. Try another search.</p>'}</div>`;
  } else if (tab === 'link') {
    body = `<div class="field"><input data-bind="url" value="${esc(ui.url)}" placeholder="Image, mp4 or YouTube link" aria-label="Scene link"><button class="btn" data-act="use-link">Use</button></div>`;
  } else if (tab === 'upload') {
    body = `<input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" aria-label="Upload a photo"><p class="hint">Photos are resized automatically.</p>`;
  } else {
    body = `<textarea data-bind="text" rows="3" maxlength="200" placeholder="Describe the scene" aria-label="Scene description">${esc(ui.text)}</textarea><button class="btn ghost" style="padding-left:0" data-act="rand">${icon('shuffle')} Surprise me</button>`;
  }
  return `<h2 class="section-title">${state.phase === 'results' ? 'Next scene' : 'Choose a scene'}</h2>
    <div class="stack"><div class="tabs" role="tablist">${tabs.map(([k, l, ic]) => `<button class="tab ${tab === k ? 'on' : ''}" role="tab" aria-selected="${tab === k}" data-act="tab" data-t="${k}">${icon(ic)}${l}</button>`).join('')}</div>
    ${body}${selPreview()}
    ${ui.sel && ui.sel.kind !== 'text' ? `<input data-bind="cap" value="${esc(ui.cap)}" maxlength="200" placeholder="Add a caption (optional)" aria-label="Caption">` : ''}</div>
    <div class="cta"><button class="btn primary block" data-act="start" ${ui.sel || ui.text.trim() ? '' : 'disabled'}>Start round</button></div>`;
}

const waitHtml = (msg) => `<div class="wait"><span>${msg}</span></div>`;
function stepsHtml(active) {
  const names = ['Pick', 'Vote', 'Results']; const i = names.indexOf(active);
  return `<ol class="steps">${names.map((n, k) => `<li class="${k === i ? 'on' : k < i ? 'done' : ''}">${n}</li>`).join('')}</ol>`;
}

function pickingHtml() {
  const my = state.myPick;
  const tabs = cfg.search ? `<div class="tabs"><button class="tab ${ui.pickTab === 'link' ? 'on' : ''}" data-act="ptab" data-t="link">Paste link</button><button class="tab ${ui.pickTab === 'search' ? 'on' : ''}" data-act="ptab" data-t="search">Search</button></div>` : '';
  const input = ui.pickTab === 'search' && cfg.search
    ? `<div class="field"><input data-bind="sq" value="${esc(ui.sq)}" placeholder="Song or artist" aria-label="Search songs"><button class="btn" data-act="song-search" aria-label="Search">${icon('search')}</button></div>
       <div class="hits">${(ui.hits || []).map((h) => `<div class="hit" data-act="pick-song" data-id="${esc(h.id)}" data-title="${esc(h.title + ' — ' + h.artist)}"><img src="${esc(h.thumb)}" alt=""><div><div>${esc(h.title)}</div><div class="hint">${esc(h.artist)}</div></div></div>`).join('')}</div>`
    : `<div class="field"><input data-bind="link" value="${esc(ui.link)}" placeholder="Spotify song link" aria-label="Spotify song link"><button class="btn primary" data-act="submit-link">Lock in</button></div>
       <p class="hint">In Spotify: ••• › Share › Copy Song Link</p>`;
  return `${stepsHtml('Pick')}<h2 class="section-title">What plays under this scene?</h2>
    <div class="stack">${tabs}${input}${my ? `<div>${embed(my.trackId)}<div class="locked">${icon('check')}Locked in. You can change it until voting starts.</div></div>` : ''}</div>
    ${state.me.isHost ? `<div class="cta"><button class="btn primary block" data-act="tovote">Start voting<span class="count nums">&nbsp;· <span data-count="picked"></span> picked</span></button></div>` : waitHtml('Waiting for the host to start voting · <span class="nums" data-count="picked"></span> picked')}`;
}

function votingHtml() {
  const rows = state.picks.map((p) => `<div class="row-vote">${embed(p.trackId)}
    ${p.mine ? '<span class="yours">Yours</span>' : `<button class="vote" data-act="vote" data-id="${esc(p.id)}" aria-label="Vote for this song" aria-pressed="false">${icon('check')}</button>`}</div>`).join('');
  return `${stepsHtml('Vote')}<h2 class="section-title">Which song scores it best?</h2><div class="stagger">${rows}</div>
    ${state.me.isHost ? `<div class="cta"><button class="btn primary block" data-act="toresults">Reveal results<span class="count nums">&nbsp;· <span data-count="voted"></span> voted</span></button></div>` : waitHtml('Votes in · <span class="nums" data-count="voted"></span>')}`;
}

function resultsHtml() {
  const rows = state.picks.map((p, i) => { const win = i === 0 && p.voters.length;
    return `<div class="result ${win ? 'win' : ''}">${win ? '<div class="tag" style="margin-bottom:var(--s2)">Winner</div>' : ''}${embed(p.trackId)}
    <div class="meta"><div><div class="who">${esc(p.author)}</div><div class="hint">${p.voters.length ? 'Voted by ' + p.voters.map(esc).join(', ') : 'No votes'}</div></div><span class="pts">+${p.voters.length * 100}</span></div></div>`; }).join('');
  return `${stepsHtml('Results')}<div class="stagger">${rows}</div>`;
}

function actionHtml() {
  const host = state.me.isHost;
  if (state.phase === 'setup') return host ? setupHtml() : waitHtml('Waiting for the host to choose a scene');
  if (state.phase === 'picking') return pickingHtml();
  if (state.phase === 'voting') return votingHtml();
  return resultsHtml() + (host ? `<div style="margin-top:var(--s7)">${setupHtml()}</div>` : waitHtml('Waiting for the host to choose the next scene'));
}

/* ---------- home ---------- */
function renderHome() {
  if (last.home) return; last.home = true; inRoom = false;
  $app.innerHTML = `<div class="home enter"><h1>Score It<i>.</i></h1><p class="lede">Pick the song that belongs under the scene. Your friends vote on who got it right.</p>
  <div class="stack"><input data-bind="name" id="name" maxlength="20" placeholder="Your name" aria-label="Your name" autocomplete="nickname" value="${esc(ui.name)}">
    <button class="btn primary block" data-act="create">Host a session</button></div>
  <div class="or">or join</div>
  <div class="field"><input class="codein" data-bind="code" id="code" maxlength="4" placeholder="CODE" aria-label="Room code" autocapitalize="characters" value="${esc(ui.code)}"><button class="btn" data-act="join">Join</button></div>
  <p class="err" id="err" role="alert">${esc(ui.err)}</p></div>`;
}

/* ---------- room ---------- */
function render() {
  if (!session || !state) { renderHome(); return; }
  delete last.home;
  if (!inRoom) {
    inRoom = true;
    $app.innerHTML = `<div id="s-head"></div><div class="room"><div class="col-main"><section id="s-stage"></section></div>
      <div class="col-side"><section id="s-action"></section><section id="s-players"></section><p class="err" id="err" role="alert"></p></div></div>`;
    ['s-head', 's-stage', 's-action', 's-players'].forEach((k) => { delete last[k]; });
  }
  const phaseKey = state.phase + ':' + state.round;
  setSection('s-head', headHtml(), 'h');
  setSection('s-stage', stageHtml(), 'scene' + state.round + JSON.stringify(state.scene || {}).length);
  setSection('s-action', actionHtml(), phaseKey);
  setSection('s-players', standingsHtml(), 'p');
  patchCounts(); autoLoadBrowse();
  if (phaseKey !== lastPhaseKey) {
    if (state.phase === 'picking' || state.phase === 'setup') { ui.sel = null; ui.cap = ''; }
    if (lastPhaseKey && state.phase !== 'setup' && window.innerWidth < 960) window.scrollTo({ top: 0, behavior: 'smooth' });
    lastPhaseKey = phaseKey;
  }
  setErr(ui.err);
}

function patchCounts() {
  const n = (k) => state.players.filter((p) => p[k]).length + '/' + state.players.length;
  document.querySelectorAll('[data-count=picked]').forEach((el) => { el.textContent = n('picked'); });
  document.querySelectorAll('[data-count=voted]').forEach((el) => { el.textContent = n('voted'); });
  const btn = document.querySelector('[data-act=tovote]'); if (btn) btn.disabled = !state.players.some((p) => p.picked);
  document.querySelectorAll('[data-pid]').forEach((el) => {
    const to = Number(el.dataset.score), prev = scoreMemo[el.dataset.pid];
    if (prev !== undefined && prev !== to) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    scoreMemo[el.dataset.pid] = to;
  });
  // vote buttons patched in place so Spotify players never reload mid-song
  document.querySelectorAll('[data-act=vote]').forEach((b) => {
    const on = state.myVote === b.dataset.id; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
}

/* ---------- scene browsing ---------- */
async function browse() {
  ui.loading = true; refreshAction();
  try { ui.results = await api(`scenes?type=${ui.type}&q=${encodeURIComponent(ui.q.trim())}`); setErr(''); }
  catch (e) { ui.results = []; setErr(e.message); }
  ui.loading = false; refreshAction();
}
function refreshAction() { if (state) { setSection('s-action', actionHtml(), state.phase + ':' + state.round, true); patchCounts(); } }
function effectiveTab() { return ui.tab || (cfg.scenes ? 'browse' : 'link'); }
function autoLoadBrowse() {
  const hostSetup = state.me.isHost && (state.phase === 'setup' || state.phase === 'results');
  if (hostSetup && cfg.scenes && effectiveTab() === 'browse' && !ui.results && !ui.loading) browse();
}
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => reject(new Error('Could not read that image'));
    img.src = url;
  });
}
function linkToScene(u) {
  u = u.trim();
  if (/youtu\.?be/.test(u)) return { kind:'youtube', url:u };
  if (/\.(mp4|webm|mov)(\?|#|$)/i.test(u)) return { kind:'video', url:u };
  return { kind:'image', url:u };
}

/* ---------- events (delegated so inputs keep focus) ---------- */
document.addEventListener('input', (e) => { const k = e.target.dataset && e.target.dataset.bind; if (k) { ui[k] = e.target.value;
  if (k === 'text') { const b = document.querySelector('[data-act=start]'); if (b) b.disabled = !(ui.sel || ui.text.trim()); } } });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return; const k = e.target.dataset && e.target.dataset.bind;
  const map = { q:'browse', sq:'song-search', link:'submit-link', url:'use-link', name:'create', code:'join' };
  if (map[k]) document.querySelector(`[data-act=${map[k]}]`)?.click();
});
document.addEventListener('change', async (e) => {
  if (e.target.id !== 'file' || !e.target.files[0]) return;
  try { const url = await shrinkImage(e.target.files[0]); ui.sel = { kind:'image', url, thumb:url }; refreshAction(); }
  catch (err) { setErr(err.message); }
});
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'leave': return leave();
    case 'copy': navigator.clipboard?.writeText(state.code).catch(() => {}); return;
    case 'create': case 'join': {
      try { const r = await api(a, { name: ui.name, code: ui.code }); setErr(''); save({ code:r.code, pid:r.pid }); poll(true); } catch (er) { setErr(er.message); } return;
    }
    case 'tab': ui.tab = d.t; if (d.t === 'browse' && !ui.results) return browse(); return refreshAction();
    case 'type': ui.type = d.t; ui.results = null; return browse();
    case 'browse': return browse();
    case 'pick-scene': ui.sel = ui.results[Number(d.i)]; return refreshAction();
    case 'clear-scene': ui.sel = null; return refreshAction();
    case 'use-link': if (!ui.url.trim()) return setErr('Paste a link first'); ui.sel = { ...linkToScene(ui.url), thumb: ui.url.trim() }; setErr(''); return refreshAction();
    case 'rand': ui.text = PROMPTS[Math.floor(Math.random() * PROMPTS.length)]; return refreshAction();
    case 'start': {
      let scene = ui.sel; if (!scene) scene = { kind:'text', caption: ui.text }; else scene = { ...scene, caption: ui.cap };
      delete scene.thumb; ui.sel = null; ui.cap = ''; ui.text = '';
      return act('scene', { scene });
    }
    case 'ptab': ui.pickTab = d.t; return refreshAction();
    case 'submit-link': { const url = ui.link; ui.link = ''; document.activeElement?.blur(); return act('pick', { url }); }
    case 'song-search': try { ui.hits = await api('search?q=' + encodeURIComponent(ui.sq)); setErr(''); } catch (er) { setErr(er.message); } return refreshAction();
    case 'pick-song': return act('pick', { trackId: d.id, title: d.title }).then(() => { ui.hits = null; });
    case 'vote': return act('vote', { target: d.id });
    case 'tovote': return act('phase', { to:'voting' });
    case 'toresults': return act('phase', { to:'results' });
  }
});

fetch(API + 'config').then((r) => r.json()).then((c) => { cfg = c; if (state) refreshAction(); }).catch(() => {});
render(); poll(true);
</script>
</body>
</html>
