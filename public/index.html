<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Score It</title>
<script src="config.js"></script>
<style>
  /* ============ Design tokens ============ */
  @property --tint { syntax:'<color>'; inherits:true; initial-value:rgba(0,0,0,0); }
  :root {
    --bg:#0a0a0b; --surface:#121214; --surface-2:#1a1a1d; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
    --text:#ededef; --mute:#8d8d95; --faint:#5b5b63;
    --accent:#e9b04a; --accent-ink:#1b1204; --danger:#f0706b;
    --t-xs:12px; --t-sm:13px; --t-md:15px; --t-lg:17px; --t-xl:22px; --t-2xl:34px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
    --r:8px; --r-lg:12px;
    --ease:cubic-bezier(.2,.7,.2,1);
    --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color-scheme: dark;
  }
  /* each phase gets its own quiet ambient tint; everything else stays constant */
  body { --tint:rgba(233,176,74,.08); transition:--tint .9s var(--ease); }
  body[data-phase=lobby] { --tint:rgba(233,176,74,.11); }
  body[data-phase=picking], body[data-phase=setup] { --tint:rgba(104,138,205,.12); }
  body[data-phase=voting] { --tint:rgba(168,108,190,.13); }
  body[data-phase=results] { --tint:rgba(233,176,74,.17); }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); min-height:100vh;
    font:400 var(--t-md)/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(70% 42% at 50% -8%, var(--tint), transparent); }
  main { max-width:1120px; margin:0 auto; padding:var(--s4); padding-top:max(var(--s4), env(safe-area-inset-top)); padding-bottom:max(var(--s8), env(safe-area-inset-bottom)); }
  h1,h2,h3,p { margin:0; }
  .label { font-size:var(--t-xs); font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .muted { color:var(--mute); } .hint { color:var(--faint); font-size:var(--t-sm); } .nums { font-variant-numeric:tabular-nums; }
  svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.i.fill { fill:currentColor; stroke:none; }

  /* ============ Controls ============ */
  button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--s2); height:48px; padding:0 var(--s5); border-radius:var(--r); border:1px solid var(--line-strong); background:transparent; font-weight:500;
    transition:background .18s var(--ease), border-color .18s, transform .12s, opacity .18s; }
  .btn:hover { background:rgba(255,255,255,.05); } .btn:active { transform:scale(.98); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; } .btn.primary:hover { background:#f0bb5c; }
  .btn.block { width:100%; } .btn:disabled { opacity:.35; cursor:not-allowed; transform:none; }
  .btn.ghost { border-color:transparent; height:36px; padding:0 var(--s3); color:var(--mute); } .btn.ghost:hover { color:var(--text); background:transparent; }
  .btn .count { opacity:.6; font-weight:500; }
  .iconbtn { width:40px; height:40px; display:inline-grid; place-items:center; border-radius:var(--r); border:1px solid transparent; background:transparent; color:var(--mute); transition:color .18s, background .18s; }
  .iconbtn:hover { color:var(--text); background:rgba(255,255,255,.06); } .iconbtn:disabled { opacity:.25; pointer-events:none; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input, textarea { width:100%; height:48px; padding:0 var(--s4); border-radius:var(--r); border:1px solid var(--line-strong); background:var(--surface); color:var(--text); font:inherit; font-size:16px; transition:border-color .18s, box-shadow .18s; }
  textarea { height:auto; padding:var(--s3) var(--s4); resize:none; line-height:1.45; }
  input::placeholder, textarea::placeholder { color:var(--faint); }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(233,176,74,.16); }
  input[type=file] { height:auto; padding:var(--s3) var(--s4); color:var(--mute); }
  .field { display:flex; gap:var(--s2); } .field > input { flex:1; min-width:0; }
  .searchbox { position:relative; } .searchbox svg { position:absolute; left:var(--s4); top:15px; color:var(--faint); } .searchbox input { padding-left:44px; }
  .tabs { display:flex; gap:var(--s5); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .tab { padding:var(--s3) 0; background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; color:var(--mute); font-weight:500; font-size:var(--t-sm); white-space:nowrap; display:flex; gap:var(--s2); align-items:center; transition:color .18s; }
  .tab:hover { color:var(--text); } .tab.on { color:var(--text); border-bottom-color:var(--text); }
  .seg { display:inline-flex; gap:var(--s4); } .seg button { background:none; border:0; padding:0; color:var(--faint); font-size:var(--t-sm); font-weight:500; } .seg button.on { color:var(--text); }

  /* ============ Avatars ============ */
  .av { --sz:40px; position:relative; width:var(--sz); height:var(--sz); border-radius:50%; display:grid; place-items:center; flex:none; background:var(--tone); color:#17120a;
    font-weight:600; font-size:calc(var(--sz) * .4); transition:box-shadow .3s var(--ease); }
  .av.done { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  .av .host { position:absolute; right:-3px; bottom:-3px; width:calc(var(--sz) * .36); height:calc(var(--sz) * .36); border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:0 0 0 2px var(--bg); }
  .av .host svg { width:60%; height:60%; stroke-width:0; fill:currentColor; }

  /* ============ Layout ============ */
  .topbar { display:flex; align-items:center; justify-content:space-between; height:48px; margin-bottom:var(--s4); }
  .wordmark { display:inline-flex; align-items:center; gap:var(--s2); font-weight:600; font-size:var(--t-lg); letter-spacing:-.02em; } .wordmark i { font-style:normal; color:var(--accent); }
  .code { display:inline-flex; align-items:center; gap:var(--s2); height:36px; padding:0 var(--s3); border-radius:var(--r); border:1px solid var(--line); background:transparent; color:var(--text); transition:border-color .18s; }
  .code:hover { border-color:var(--line-strong); } .code b { font:600 var(--t-md) var(--mono); letter-spacing:.28em; margin-right:-.28em; } .code svg { color:var(--mute); }
  .room { display:grid; grid-template-columns:minmax(0,1fr); gap:var(--s5); } .room > *, .col-side > * { min-width:0; }
  .col-side > section + section { margin-top:var(--s6); }
  .room.lobby { max-width:560px; margin:0 auto; } .room.lobby .col-main, .room.lobby #s-players { display:none; }
  @media (min-width:960px) {
    main { padding:var(--s5) var(--s6) var(--s8); }
    .room:not(.lobby) { grid-template-columns:minmax(0,1.55fr) minmax(360px,1fr); gap:var(--s7); align-items:start; }
    .col-main { position:sticky; top:var(--s5); }
  }

  /* ============ Mark + home ============ */
  .mark { width:56px; height:36px; color:var(--text); } .mark rect.frame { fill:none; stroke:currentColor; stroke-width:1.5; opacity:.9; }
  .mark .bar { fill:var(--accent); transform-box:fill-box; transform-origin:center; animation:eq 1.3s ease-in-out infinite alternate; }
  .mark .bar:nth-child(2){animation-delay:-.4s} .mark .bar:nth-child(3){animation-delay:-.9s} .mark .bar:nth-child(4){animation-delay:-.2s} .mark .bar:nth-child(5){animation-delay:-.7s}
  @keyframes eq { from { transform:scaleY(.35); } to { transform:scaleY(1); } }
  .home { max-width:400px; margin:0 auto; padding-top:clamp(40px,14vh,130px); }
  .home h1 { font-size:var(--t-2xl); font-weight:650; letter-spacing:-.035em; line-height:1.05; margin-top:var(--s5); } .home h1 i { font-style:normal; color:var(--accent); }
  .home .lede { margin:var(--s3) 0 var(--s6); color:var(--mute); font-size:var(--t-lg); line-height:1.4; }
  .home .stack > * + * { margin-top:var(--s3); }
  .or { display:flex; align-items:center; gap:var(--s3); margin:var(--s5) 0; color:var(--faint); font-size:var(--t-xs); letter-spacing:.1em; text-transform:uppercase; }
  .or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }
  .codein { text-align:center; font:600 var(--t-lg) var(--mono) !important; letter-spacing:.4em; text-transform:uppercase; padding-left:calc(var(--s4) + .4em) !important; }

  /* ============ Lobby ============ */
  .lobby-head { text-align:center; padding-top:var(--s5); }
  .tiles { display:flex; justify-content:center; gap:var(--s2); margin:var(--s3) 0 var(--s2); }
  .tiles span { width:clamp(52px,17vw,72px); aspect-ratio:3/4; display:grid; place-items:center; border:1px solid var(--line-strong); border-radius:var(--r-lg); background:var(--surface);
    font:600 clamp(28px,9vw,40px) var(--mono); animation:rise .5s var(--ease) both; } .tiles span:nth-child(2){animation-delay:.05s} .tiles span:nth-child(3){animation-delay:.1s} .tiles span:nth-child(4){animation-delay:.15s}
  .roster { display:flex; flex-wrap:wrap; justify-content:center; gap:var(--s5) var(--s3); margin:var(--s7) 0 var(--s6); } .roster .pl { width:92px; }
  .pl { display:flex; flex-direction:column; align-items:center; gap:var(--s2); text-align:center; min-width:0; }
  .pl .nm { font-size:var(--t-sm); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .pl .sub { font-size:var(--t-xs); color:var(--faint); margin-top:-6px; }
  .pl.empty .av { background:transparent; border:1px dashed var(--line-strong); color:var(--faint); }

  /* ============ Scene ============ */
  .scene-label { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:var(--s3); }
  .stage { position:relative; aspect-ratio:16/9; background:#000; overflow:hidden; border-radius:var(--r-lg); }
  .stage .bg { position:absolute; inset:-8%; width:116%; height:116%; object-fit:cover; filter:blur(36px) brightness(.5) saturate(1.1); }
  .stage .fg, .stage video, .stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:contain; }
  .stage.text { display:grid; place-items:center; padding:var(--s6); background:#000; border:1px solid var(--line); text-align:center; }
  .stage.text::before, .stage.text::after { content:""; position:absolute; left:0; right:0; height:14%; background:#000; } .stage.text::before { top:0; border-bottom:1px solid var(--line); } .stage.text::after { bottom:0; border-top:1px solid var(--line); }
  .stage.text p { font:500 clamp(22px,3.8vw,40px)/1.18 var(--serif); letter-spacing:-.01em; max-width:20ch; text-wrap:balance; }
  .stage.empty::before, .stage.empty::after { display:none; }
  @media (max-width:959px) { .stage.empty { display:none; } }
  .stage.empty p { font:400 var(--t-sm)/1.4 -apple-system,"Segoe UI",sans-serif; color:var(--faint); display:flex; flex-direction:column; align-items:center; gap:var(--s3); } .stage.empty svg { width:24px; height:24px; }
  .scene-meta { display:flex; justify-content:space-between; gap:var(--s4); margin-top:var(--s3); }
  .scene-meta .cap { font:500 var(--t-lg)/1.35 var(--serif); letter-spacing:-.005em; } .scene-meta a { color:var(--faint); text-decoration:none; font-size:var(--t-xs); white-space:nowrap; } .scene-meta a:hover { color:var(--mute); }
  @media (max-width:959px) { .stage { margin:0 calc(var(--s4) * -1); border-radius:0; } .stage.text { border-left:0; border-right:0; } }

  /* ---- full-screen scene reveal ---- */
  .reveal { position:fixed; inset:0; z-index:100; background:#000; display:grid; animation:fadein .5s var(--ease) both; cursor:pointer; }
  .reveal.out { animation:fadeout .45s var(--ease) forwards; }
  .reveal .media { position:absolute; inset:0; overflow:hidden; }
  .reveal .media img, .reveal .media video { width:100%; height:100%; object-fit:cover; animation:ken 7s ease-out both; }
  .reveal .media iframe { width:100%; height:100%; border:0; pointer-events:none; }
  .reveal .media.text { display:grid; place-items:center; padding:var(--s6); }
  .reveal .media.text p { font:500 clamp(30px,7vw,64px)/1.12 var(--serif); letter-spacing:-.02em; text-align:center; max-width:18ch; text-wrap:balance; animation:rise .9s .2s var(--ease) both; }
  .reveal .shade { position:absolute; inset:auto 0 0 0; height:46%; background:linear-gradient(to top,rgba(0,0,0,.85),transparent); pointer-events:none; }
  .reveal .cap { position:absolute; left:0; right:0; bottom:0; padding:var(--s6) var(--s5) calc(var(--s7) + env(safe-area-inset-bottom)); max-width:900px; animation:rise .8s .35s var(--ease) both; }
  .reveal .cap .t { font:500 clamp(24px,4.4vw,44px)/1.12 var(--serif); letter-spacing:-.015em; margin-top:var(--s2); text-wrap:balance; }
  .reveal .cap .label { color:var(--accent); }
  .reveal .skip { position:absolute; right:var(--s5); top:max(var(--s5), env(safe-area-inset-top)); font-size:var(--t-xs); letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.6); }
  .reveal .bar { position:absolute; left:0; bottom:0; height:2px; background:var(--accent); animation:grow var(--dur) linear forwards; }
  @keyframes ken { from { transform:scale(1); } to { transform:scale(1.07); } }
  @keyframes grow { from { width:0; } to { width:100%; } } @keyframes fadein { from { opacity:0; } } @keyframes fadeout { to { opacity:0; } }

  /* ============ Phase sections ============ */
  .steps { display:flex; gap:var(--s4); margin:0 0 var(--s5); padding:0; font-size:var(--t-xs); font-weight:500; letter-spacing:.1em; text-transform:uppercase; }
  .steps li { list-style:none; color:var(--faint); } .steps li.on { color:var(--text); } .steps li.done { color:var(--mute); }
  .section-title { font-size:var(--t-xl); font-weight:600; letter-spacing:-.02em; line-height:1.2; margin-bottom:var(--s4); }
  .stack > * + * { margin-top:var(--s4); }
  .cta { position:sticky; bottom:max(var(--s3), env(safe-area-inset-bottom)); padding-top:var(--s4); margin-top:var(--s4); background:linear-gradient(to top,var(--bg) 70%,transparent); z-index:5; }
  .cta.flow { position:static; background:none; padding-top:0; margin-top:var(--s4); }
  .cta .btn + .btn { margin-top:var(--s2); }
  .wait { display:flex; align-items:center; gap:var(--s3); color:var(--mute); font-size:var(--t-sm); padding:var(--s4) 0; }
  .wait::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); animation:pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { opacity:.25; } }

  /* browse grid */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .tile { position:relative; aspect-ratio:16/10; padding:0; border:0; border-radius:var(--r); overflow:hidden; background:var(--surface-2); cursor:pointer; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s var(--ease); } .tile:hover img { transform:scale(1.04); }
  .tile.sel::after { content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 2px var(--accent); border-radius:var(--r); }
  .tile .badge { position:absolute; left:6px; bottom:6px; width:22px; height:22px; display:grid; place-items:center; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; } .tile .badge svg { width:11px; height:11px; }
  .skeleton { aspect-ratio:16/10; border-radius:var(--r); background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%); background-size:200% 100%; animation:shimmer 1.3s linear infinite; } @keyframes shimmer { to { background-position:-200% 0; } }
  .selected { display:flex; align-items:center; gap:var(--s3); padding:var(--s3); border:1px solid var(--line-strong); border-radius:var(--r); }
  .selected .th { width:72px; aspect-ratio:16/10; border-radius:6px; object-fit:cover; background:var(--surface-2); flex:none; display:grid; place-items:center; color:var(--mute); }

  /* ---- song search + locked pick ---- */
  .art { width:var(--sz,52px); height:var(--sz,52px); border-radius:6px; object-fit:cover; background:var(--surface-2); flex:none; display:block; }
  .song-row { display:flex; align-items:center; gap:var(--s3); width:100%; padding:var(--s2); margin:0 calc(var(--s2) * -1); border-radius:var(--r); background:none; border:0; text-align:left; transition:background .15s; }
  .song-row:hover { background:rgba(255,255,255,.05); } .song-row .tx { flex:1; min-width:0; } .song-row .tx > * { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .song-row .add { color:var(--faint); } .song-row:hover .add { color:var(--accent); }
  .results-list { margin-top:var(--s2); } .results-list .song-row { animation:rise .3s var(--ease) both; }
  .locked-card { display:flex; align-items:center; gap:var(--s4); padding:var(--s4); border-radius:var(--r-lg); background:var(--surface); border:1px solid var(--line); animation:rise .4s var(--ease) both; }
  .locked-card .tx { flex:1; min-width:0; } .locked-card .t { font-weight:600; font-size:var(--t-lg); letter-spacing:-.01em; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .submitted { display:inline-flex; align-items:center; gap:6px; color:var(--accent); font-size:var(--t-xs); font-weight:600; letter-spacing:.1em; text-transform:uppercase; margin-bottom:2px; }
  .strip { display:flex; flex-wrap:wrap; gap:var(--s4) var(--s5); }
  .strip .pl { flex-direction:row; gap:var(--s2); } .strip .pl .nm { font-size:var(--t-sm); max-width:9ch; } .strip .sc { font-size:var(--t-sm); color:var(--mute); font-variant-numeric:tabular-nums; }
  .strip .sc.bump { animation:bump .6s var(--ease); } @keyframes bump { 30% { color:var(--accent); transform:translateY(-2px); } }

  /* ---- listening / voting pager ---- */
  .pager { display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--s3); }
  .dots { display:flex; gap:6px; } .dots i { width:6px; height:6px; border-radius:50%; background:var(--faint); transition:all .25s var(--ease); } .dots i.on { width:18px; border-radius:3px; background:var(--text); } .dots i.v { background:var(--accent); }
  .slides { position:relative; }
  .slide { display:none; } .slide.cur { display:block; animation:rise .4s var(--ease) both; }
  .slide iframe { display:block; width:100%; height:352px; border:0; border-radius:var(--r-lg); color-scheme:normal; background:var(--surface); }
  .votebtn.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .votebtn.on:hover { background:#f0bb5c; }

  /* ---- results ---- */
  .podium { display:grid; gap:var(--s5); animation:rise .7s var(--ease) both; animation-delay:var(--d,0s); }
  .winner { display:grid; grid-template-columns:auto 1fr; gap:var(--s5); align-items:center; }
  .winner .art { --sz:132px; border-radius:var(--r); box-shadow:0 24px 50px -24px rgba(233,176,74,.5); }
  .winner .tag { color:var(--accent); font-size:var(--t-xs); font-weight:600; letter-spacing:.14em; text-transform:uppercase; }
  .winner .t { font:500 clamp(24px,5vw,34px)/1.1 var(--serif); letter-spacing:-.02em; margin:var(--s2) 0 var(--s1); text-wrap:balance; }
  .winner .pts { font-size:clamp(40px,9vw,60px); font-weight:650; letter-spacing:-.04em; line-height:1; color:var(--accent); margin-top:var(--s3); font-variant-numeric:tabular-nums; }
  @media (max-width:560px) { .winner { grid-template-columns:1fr; justify-items:center; text-align:center; } .winner .art { --sz:min(62vw,240px); } }
  .rank { display:flex; align-items:center; gap:var(--s3); padding:var(--s3) 0; border-top:1px solid var(--line); animation:rise .5s var(--ease) both; animation-delay:var(--d,0s); }
  .rank .n { width:18px; color:var(--faint); font-size:var(--t-sm); } .rank .tx { flex:1; min-width:0; } .rank .tx > div:first-child { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank .p { font-weight:600; color:var(--mute); font-variant-numeric:tabular-nums; }
  .embed80 iframe { display:block; width:100%; height:80px; border:0; border-radius:var(--r); margin:0 0 var(--s3); }
  .err { color:var(--danger); font-size:var(--t-sm); min-height:1.4em; margin-top:var(--s4); }

  /* ============ Motion ============ */
  .enter { animation:rise .4s var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
